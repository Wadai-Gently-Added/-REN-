<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>美文字練習帳 統合版 v3.2.0 (2026-08-24 build)</title>
<link rel="stylesheet" href="02_style.css">
<script>
/* ============================================================
 * マスター設定（01_index.html に統合）
 * ビルド: v3.2.0  2026-08-24
 *  - プレビュー領域を position:fixed でサイドバー分ずらす
 *  - render() を requestAnimationFrame 経由に変更 (layout確定後に描画)
 *  - fitPageToViewport() で常にA4比率になるよう width/height を JS がセット
 * ============================================================ */
const APP_VERSION = 'v3.2.0';
const APP_BUILD    = '2026-08-24';
const CELL_MIN  = 10;
const GAP       = 20;
const BOX_RATIO = 0.22;

function byId(id) { return document.getElementById(id); }

function getState() {
  return {
    text:        byId('txtIn').value,
    mode:        byId('paperMode').value,            // ③-①
    orientation: byId('paperOrientation').value,     // ②-①
    fontSizePct: parseFloat(byId('commonFontSize').value) || 100, // ④-①

    /* ③-② モード形状 (内容が③-①でJS差し替え) */
    grid: {
      foldCount: parseInt(byId('colsPerRow').value, 10),
      wMode:     byId('wMode').value,
    },
    ruled: {
      dir:       byId('ruledDir').value,
      lineCount: parseInt(byId('lineCount').value, 10) || 5,
      lineGap:   byId('lineGap').value,
      modelPos:  byId('modelPos').value,
    },
    circle: {
      shape:        byId('shapeSelect').value,
      rotationMode: byId('rotationModeSelect').value, // ⑤
      hand:         byId('handCircle').value,         // ⑥（円形＋縦マス目で共用・単一ID）
      diameter:     parseFloat(byId('diameterRange').value) || 60, // ④-②
      packDir:      byId('packDir').value,            // ⑦
    },

    /* ⑧-① 練習セット構成と⑧-② 練習回数設定（マス目/一筆箋/丸形 全モード共有） */
    setType: byId('setType').value,
    counts: {
      black:    parseInt(byId('cntBlack').value,    10) || 0,
      grayFull: parseInt(byId('cntGrayFull').value, 10) || 0,
      grayVert: parseInt(byId('cntGrayVert').value, 10) || 0,
      grayNone: parseInt(byId('cntGrayNone').value, 10) || 0,
      empty:    parseInt(byId('cntEmpty').value,    10) || 0,
    },

    canvas: byId('canvas'),
    page:   byId('pageContainer'),
    circlePage: byId('circlePage'),
    pTitle: byId('pTitle'),
  };
}
</script>
</head>
<body>

<button class="toggle-btn no-print" onclick="toggleMenu()" id="tBtn">メニューを閉じる</button>

<!-- ★ 全項目①〜⑧-②を常時全部表示。不要時は .disabled でグレーアウト＋操作不可にするだけ -->
<div class="sidebar no-print" id="side">
  <h3 style="color:#ff6b8b; margin:0; font-size:14px; padding-top:28px;">美文字練習帳 統合版 <span id="verBadge" style="font-size:10px;color:#888;font-weight:normal;"></span></h3>

  <!-- ① 練習する文字（改行で複数行 / ""で一塊） -->
  <div class="config-row" data-row="text">
    <label>① 練習する文字（改行で複数行 / ""で一塊）</label>
    <textarea id="txtIn" rows="3" oninput="render()">お誕生日おめでとうございます</textarea>
  </div>

  <!-- ②-① 紙の向き、サイズ -->
  <div class="config-row" data-row="orient">
    <label>②-① 紙の向き、サイズ</label>
    <select id="paperOrientation" onchange="render()">
      <option value="portrait" selected>A4 縦</option>
      <option value="landscape">A4 横</option>
    </select>
  </div>

  <!-- ③-① 練習モード（通常／丸形／一筆箋） -->
  <div class="config-row" data-row="mode">
    <label>③-① 練習モード</label>
    <select id="paperMode" onchange="onModeChange()">
      <option value="a4-grid" selected>通常（マス目）</option>
      <option value="ippitsu-ruled">一筆箋（罫線）</option>
      <option value="circle">丸形美文字</option>
    </select>
  </div>

  <!-- ③-② モード形状（③-①でJS差し替え） -->
  <div class="config-row" data-row="shape">
    <label>③-② モード形状</label>
    <div id="modeShapeBox" class="mode-shape-box"></div>
  </div>

  <!-- ④-① 文字サイズ（全モード共通スライダー） -->
  <div class="config-row" data-row="font">
    <label>④-① 文字サイズ（全モード共通）</label>
    <div class="diam-ctrl">
      <input type="range" id="commonFontSize" min="0" max="100" value="100" step="1" oninput="onCommonFontSize(this.value)">
      <input type="number" id="commonFontSizeNum" min="0" max="100" value="100" onchange="onCommonFontSize(this.value)">
    </div>
  </div>

  <!-- ④-② 円直径（丸形盤のみ反映。他モード時は .disabled） -->
  <div class="config-row" data-row="diameter">
    <label>④-② 円直径（丸形盤のみ反映）</label>
    <div class="diam-ctrl">
      <input type="range" id="diameterRange" min="30" max="100" value="60" step="1" oninput="onDiameterChange(this.value)">
      <input type="number" id="diameterNum" min="30" max="100" value="60" onchange="onDiameterChange(this.value)">
    </div>
  </div>

  <!-- ⑤ 文字向き（丸形盤のみ反映） -->
  <div class="config-row" data-row="rotation">
    <label>⑤ 文字向き（丸形盤のみ反映）</label>
    <select id="rotationModeSelect" onchange="render()">
      <option value="fixed" selected>上向き（水平固定）</option>
      <option value="center-out">外向き（放射）</option>
      <option value="center-in">内向き（中心向き）</option>
    </select>
  </div>

  <!-- ⑥ 利き手（単一ID handCircle に統一） -->
  <div class="config-row" data-row="hand">
    <label>⑥ 利き手</label>
    <select id="handCircle" onchange="render()">
      <option value="right" selected>右利き</option>
      <option value="left">左利き</option>
    </select>
  </div>

  <!-- ⑦ 練習配置方向（丸形盤のみ反映） -->
  <div class="config-row" data-row="pack">
    <label>⑦ 練習配置方向（丸形盤のみ反映）</label>
    <select id="packDir" onchange="render()">
      <option value="horizontal">横並び（左右優先）</option>
      <option value="vertical" selected>縦並び（上下連続・動線重視）</option>
    </select>
  </div>

  <!-- ⑧-① 練習セット構成（3モード共通） -->
  <div class="config-row" data-row="settype">
    <label>⑧-① 練習セット構成</label>
    <select id="setType" onchange="onSetTypeChange()">
      <option value="standard" selected>標準（黒見本1・グレー1・空枠1）</option>
      <option value="many">多め（黒見本1・グレー2・空枠5）</option>
      <option value="custom">カスタム（⑧-② で個別指定）</option>
    </select>
  </div>

  <!-- ⑧-② 練習回数設定（カスタムを選んだときだけ活性） -->
  <div class="config-row" data-row="repeat" id="repeatRow">
    <label>⑧-② 練習回数設定</label>
    <div class="repeat-grid" id="repeatGrid">
      <div class="repeat-card">
        <div class="rc-name">黒文字見本</div>
        <div class="rc-sub">縦横補助線あり</div>
        <input type="number" id="cntBlack"    value="1" min="0" max="10" onchange="render()">
      </div>
      <div class="repeat-card">
        <div class="rc-name">なぞり練習</div>
        <div class="rc-sub">グレー＋縦横補助線</div>
        <input type="number" id="cntGrayFull" value="2" min="0" max="10" onchange="render()">
      </div>
      <div class="repeat-card">
        <div class="rc-name">練習（縦線のみ）</div>
        <div class="rc-sub">グレー＋縦補助線のみ</div>
        <input type="number" id="cntGrayVert" value="2" min="0" max="10" onchange="render()">
      </div>
      <div class="repeat-card">
        <div class="rc-name">練習（補助なし）</div>
        <div class="rc-sub">グレー文字のみ</div>
        <input type="number" id="cntGrayNone" value="2" min="0" max="10" onchange="render()">
      </div>
      <div class="repeat-card">
        <div class="rc-name">自由練習</div>
        <div class="rc-sub">空枠で自力練習</div>
        <input type="number" id="cntEmpty"    value="5" min="0" max="20" onchange="render()">
      </div>
    </div>
  </div>

  <button class="btn"           onclick="render()">画面を更新</button>
  <button class="btn btn-print" onclick="window.print()">印刷する</button>

  <div style="font-size:10px;color:#888;text-align:center;margin-top:8px;">
    美文字練習帳 統合版 <span id="verFooter"></span>
  </div>
</div>

<div class="preview-area" id="previewArea">
  <div class="page" id="pageContainer">
    <div class="page-title" id="pTitle">練習帳</div>
    <div class="canvas-container" id="canvas"></div>
  </div>
  <div class="page-container" id="circlePage" style="display:none;">
    <svg class="workspace-svg" id="mainSvg" viewBox="0 0 210 297" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
</div>

<script src="04_parser.js"></script>
<script src="05_blocks.js"></script>
<script src="06_grid.js"></script>
<script src="07_ruled.js"></script>
<script src="08_circle.js"></script>
<script src="09_main.js"></script>
<script>
  // 画面右上にバージョン表示（BOM無しでもJSが動く最終行）
  setTimeout(() => {
    const v = APP_VERSION + ' build ' + APP_BUILD;
    if (byId('verBadge'))  byId('verBadge').textContent  = '(' + v + ')';
    if (byId('verFooter')) byId('verFooter').textContent = v;
  }, 0);
</script>
</body>
</html>
